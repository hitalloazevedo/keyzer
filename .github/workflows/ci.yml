name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
        if: matrix.node == 22
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: keyzer-html
          path: dist-web/keyzer.html
