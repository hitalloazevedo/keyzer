# Publishes the CLI to npm with provenance, using npm trusted publishing (OIDC),
# so no npm token is stored in GitHub.
#
# One-time setup (the package must exist on npm before a trusted publisher can be added):
#   1. Publish the first version by hand from your machine:  npm login && npm publish   (the scoped name is public via publishConfig)
#   2. On npmjs.com: @hitalloazevedo/keyzer -> Settings -> Trusted publisher -> GitHub Actions
#      owner "hitalloazevedo", repository "keyzer", workflow "publish-npm.yml".
#
# To publish a later version: bump "version" in package.json, tag it (see release.yml),
# then Actions -> "Publish to npm" -> Run workflow, and pick that tag as the ref.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm verify this workflow's identity and record provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Must run on a tag that matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Run this workflow on the tag $expected (current ref: $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
            exit 1
          fi

      - run: npm test

      - run: npm publish --provenance --access public
